name: Run Horary Future Window V1
on: push
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/horary-future-window-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply patch
        run: python .github/scripts/apply_horary_future_window_v1.py
      - name: Install dependencies
        run: pip install -q -r requirements.txt
      - name: Run focused regression
        run: python -m unittest tests.test_horary_engine_v6
      - name: Commit patch
        shell: bash
        run: |
          rm -f .github/workflows/_apply-horary-future-window-v1.yml
          rm -f .github/workflows/_run-horary-future-window-v1.yml
          rm -f .github/scripts/apply_horary_future_window_v1.py
          git config user.name 'openai-codex'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Apply Horary future-window V1'
          git push origin HEAD:feat/horary-future-window-v1
