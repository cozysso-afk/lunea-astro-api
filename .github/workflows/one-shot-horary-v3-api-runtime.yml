name: One-shot Horary V3 API-path validation

on:
  push:
    branches: [feature/horary-balance-v3]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime dependencies
        run: pip install -r requirements.txt
      - name: Run actual API-path cases
        shell: bash
        run: |
          python3 - <<'PY'
          import time, json
          from astro_api import HoraryRequest, horary

          cases = [
              ('reconciliation', '그 사람과 다시 관계가 회복될 가능성이 있을까?', 7, 5),
              ('exam', '이번 시험에서 합격 결과를 받을 수 있을까?', 9, 10),
              ('purchase', '지금 고민 중인 물건을 사는 선택이 괜찮을까?', 2, None),
              ('friend', '이 친구와 관계가 다시 편해질 수 있을까?', 11, None),
          ]
          rows=[]
          total_start=time.perf_counter()
          for topic, question, expected_q, expected_event in cases:
              started=time.perf_counter()
              data=horary(HoraryRequest(
                  question_text=question,
                  question_iso='2026-09-02T08:41',
                  topic=topic,
                  timezone='Asia/Seoul',
                  place='서울',
              ))
              elapsed=time.perf_counter()-started
              assert data.get('schema') == 'LUNEA_HORARY_V1'
              balance=(data.get('judgment_support') or {}).get('balance_v3') or {}
              assert balance.get('version') == 'LUNEA_HORARY_BALANCE_V3'
              sig=data.get('significators') or {}
              qh=(sig.get('quesited') or {}).get('house')
              eh=(sig.get('event') or {}).get('house')
              assert qh == expected_q, (topic, qh, expected_q)
              assert eh == expected_event, (topic, eh, expected_event)
              rows.append({
                  'topic':topic,'seconds':round(elapsed,3),
                  'tier':balance.get('tier'),'headline':balance.get('headline_ko'),
                  'support_score':balance.get('support_score'),
                  'constraint_score':balance.get('constraint_score'),
                  'quesited_house':qh,'event_house':eh,
                  'perfection_reason':((data.get('judgment_support') or {}).get('perfection') or {}).get('reason'),
              })
          total=time.perf_counter()-total_start
          assert total < 120, total
          print(json.dumps({'total_seconds':round(total,3),'cases':rows}, ensure_ascii=False, indent=2))
          PY
      - name: Remove one-shot workflow and downloads
        if: success()
        shell: bash
        run: |
          rm -f .github/workflows/one-shot-horary-v3-api-runtime.yml de440s.bsp de421.bsp
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: remove one-shot Horary API validator"
          git push
