name: One-off persistent V6 production smoke

on:
  pull_request:
    branches:
      - chore/v6-persistent-smoke-base-20261007

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Measure first/reused V6 canary and V5 isolation
        shell: bash
        env:
          CANARY_TOKEN: ${{ github.event.pull_request.base.sha }}
        run: |
          cat >/tmp/horary.json <<'JSON'
          {
            "question_text": "이 일은 실제로 성사될까요?",
            "question_iso": "2026-09-04T15:00:00+09:00",
            "topic": "general",
            "timezone": "Asia/Seoul",
            "place": "현재 위치",
            "lat": 34.7594,
            "lon": 127.6530
          }
          JSON

          UNAUTH=$(curl -sS --max-time 30 -o /tmp/unauth.json -w '%{http_code} %{time_total}' \
            -H 'Content-Type: application/json' --data-binary @/tmp/horary.json \
            https://lunea-astro-api-v2.onrender.com/v1/horary/canary-v6)
          echo "CANARY_UNAUTH=$UNAUTH"
          test "${UNAUTH%% *}" = "404"

          FIRST=$(curl -sS --max-time 100 -o /tmp/canary1.json -w '%{http_code} %{time_total}' \
            -H 'Content-Type: application/json' -H "X-LUNEA-Canary: $CANARY_TOKEN" \
            --data-binary @/tmp/horary.json \
            https://lunea-astro-api-v2.onrender.com/v1/horary/canary-v6)
          echo "CANARY_FIRST=$FIRST"

          SECOND=$(curl -sS --max-time 100 -o /tmp/canary2.json -w '%{http_code} %{time_total}' \
            -H 'Content-Type: application/json' -H "X-LUNEA-Canary: $CANARY_TOKEN" \
            --data-binary @/tmp/horary.json \
            https://lunea-astro-api-v2.onrender.com/v1/horary/canary-v6)
          echo "CANARY_REUSED=$SECOND"

          V5=$(curl -sS --max-time 60 -o /tmp/v5.json -w '%{http_code} %{time_total}' \
            -H 'Content-Type: application/json' --data-binary @/tmp/horary.json \
            https://lunea-astro-api-v2.onrender.com/v1/horary)
          echo "PRODUCTION_V5=$V5"

          python - <<'PY'
          import json
          with open("/tmp/canary1.json", encoding="utf-8") as f:
              first=json.load(f)
          with open("/tmp/canary2.json", encoding="utf-8") as f:
              second=json.load(f)
          with open("/tmp/v5.json", encoding="utf-8") as f:
              v5=json.load(f)

          c1=first.get("canary") or {}
          c2=second.get("canary") or {}
          r1=first.get("result") or {}
          r2=second.get("result") or {}

          print("FIRST_WORKER_STARTED="+str(c1.get("worker_started")))
          print("FIRST_PARENT_SECONDS="+str(c1.get("elapsed_seconds")))
          print("FIRST_COMPUTE_SECONDS="+str(c1.get("worker_compute_seconds")))
          print("SECOND_WORKER_STARTED="+str(c2.get("worker_started")))
          print("SECOND_PARENT_SECONDS="+str(c2.get("elapsed_seconds")))
          print("SECOND_COMPUTE_SECONDS="+str(c2.get("worker_compute_seconds")))
          print("CANARY_ENGINE="+str((r2.get("meta") or {}).get("horary_engine")))
          print("PRODUCTION_ENGINE="+str((v5.get("meta") or {}).get("horary_engine")))
          print("V6_REPEAT_OUTPUT_EXACT_EQUAL="+str(r1 == r2))

          assert first.get("schema") == "LUNEA_HORARY_CANARY_V6_V1"
          assert second.get("schema") == "LUNEA_HORARY_CANARY_V6_V1"
          assert c1.get("worker_started") is True
          assert c2.get("worker_started") is False
          assert r1 == r2
          assert (r2.get("meta") or {}).get("horary_engine") == "LUNEA_HORARY_ENGINE_V6_STRICT_TRADITIONAL_CORE"
          assert (v5.get("meta") or {}).get("horary_engine") == "LUNEA_HORARY_ENGINE_V5_MOIETY_SECT"
          PY
