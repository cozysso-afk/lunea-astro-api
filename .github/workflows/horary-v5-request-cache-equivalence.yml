name: Verify Horary V5 request-cache equivalence

on:
  pull_request:
    branches: [main]

jobs:
  equivalence:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout base main
        uses: actions/checkout@v4
        with:
          ref: main
          path: base
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          path: head
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: head/requirements.txt
      - run: pip install -r head/requirements.txt
      - name: Compare base and candidate outputs
        shell: bash
        run: |
          cat >/tmp/run_cases.py <<'PY'
          import json, sys, time
          sys.path.insert(0, sys.argv[1])
          import astro_api

          cases = [
              ("general","2026-10-06T18:35:00+09:00","여수"),
              ("relationship","2026-09-05T10:00:00+09:00","여수"),
              ("relationship","2026-09-05T02:00:00+09:00","여수"),
              ("reconciliation","2026-09-02T08:30:00+09:00","서울"),
              ("contact","2026-10-01T23:15:00+09:00","여수"),
              ("money","2026-10-02T09:05:00+09:00","서울"),
              ("stock","2026-10-02T14:20:00+09:00","여수"),
              ("lost_object","2026-09-05T07:07:00+09:00","여수"),
              ("career","2026-08-25T22:30:00+09:00","서울"),
              ("exam","2026-10-06T07:10:00+09:00","여수"),
          ]

          rows=[]
          started=time.perf_counter()
          for i,(topic,moment,place) in enumerate(cases):
              rows.append(astro_api.compute_horary(
                  question_text=f"request-cache-equivalence-{i}",
                  question_iso=moment,
                  topic=topic,
                  timezone_name="Asia/Seoul",
                  place=place,
              ))
          elapsed=time.perf_counter()-started
          print(f"SECONDS={elapsed:.6f}")
          print(json.dumps(rows,ensure_ascii=False,sort_keys=True,separators=(",",":")))
          PY

          (
            cd base
            python /tmp/run_cases.py "$PWD" > /tmp/base.out
          )
          (
            cd head
            python /tmp/run_cases.py "$PWD" > /tmp/head.out
          )

          grep '^SECONDS=' /tmp/base.out
          grep '^SECONDS=' /tmp/head.out

          tail -n 1 /tmp/base.out > /tmp/base.json
          tail -n 1 /tmp/head.out > /tmp/head.json
          cmp /tmp/base.json /tmp/head.json
          echo "HORARY_OUTPUT_EXACT_EQUAL=true"
