name: One-off V6 CPU canary benchmark

on:
  pull_request:
    branches:
      - chore/v6-benchmark-base

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Profile V6-only optimized chain
        shell: bash
        run: |
          python - <<'PY'
          import cProfile, io, pstats, time

          import astro_core as core
          import horary_topic_routes_v3  # production V4 -> V5
          import horary_engine_v6 as v6
          import horary_performance_v2 as perf2
          import horary_performance_v1 as perf1
          import horary_balance_v31 as v31

          kwargs = dict(
              question_text="A는 2026년 10월 31일까지 나에게 먼저 사적인 연락을 해올까요?",
              question_iso="2026-10-05T18:25:23+09:00",
              topic="contact",
              timezone_name="Asia/Seoul",
              place="현재 위치",
              lat=34.7594,
              lon=127.6530,
          )

          core.load_ephemeris()
          perf2.clear_caches()
          perf1.clear_caches()

          profiler=cProfile.Profile()
          started=time.perf_counter()
          profiler.enable()
          data=v31.compute_horary(**kwargs)
          profiler.disable()
          elapsed=time.perf_counter()-started

          print(f"V6_ONLY_PROFILE_SECONDS={elapsed:.6f}")
          print("V6_ONLY_ENGINE=", (data.get("meta") or {}).get("horary_engine"))
          assert (data.get("meta") or {}).get("horary_engine") == v6.VERSION

          out=io.StringIO()
          pstats.Stats(profiler,stream=out).strip_dirs().sort_stats("cumulative").print_stats(80)
          print("V6_ONLY_CPROFILE_BEGIN")
          print(out.getvalue())
          print("V6_ONLY_CPROFILE_END")
          PY
