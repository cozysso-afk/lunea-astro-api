name: One-off V6 CPU canary benchmark

on:
  push:
    branches:
      - chore/v6-cpu-canary-benchmark-20261006

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Build current production image
        run: docker build -t lunea-v6-canary .
      - name: Benchmark V5 vs V6 at Render free CPU limit
        shell: bash
        run: |
          docker run --rm --cpus=0.15 --entrypoint python lunea-v6-canary - <<'PY'
          import time

          import astro_core as core
          import horary_topic_routes_v3  # production V4 -> V5
          import horary_balance_v31 as v31

          kwargs = dict(
              question_text="A는 2026년 10월 31일까지 나에게 먼저 사적인 연락을 해올까요?",
              question_iso="2026-10-05T18:25:23+09:00",
              topic="contact",
              timezone_name="Asia/Seoul",
              place="현재 위치",
              lat=34.7594,
              lon=127.6530,
          )

          core.load_ephemeris()

          t0=time.perf_counter()
          v5_data=v31.compute_horary(**kwargs)
          v5_seconds=time.perf_counter()-t0
          print(f"THROTTLED_V5_SECONDS={v5_seconds:.6f}")
          print("THROTTLED_V5_ENGINE=", (v5_data.get("meta") or {}).get("horary_engine"))
          assert (v5_data.get("meta") or {}).get("horary_engine") == "LUNEA_HORARY_ENGINE_V5_MOIETY_SECT"

          import horary_engine_v6 as v6
          import horary_performance_v2 as perf2
          import horary_performance_v1 as perf1

          perf2.clear_caches()
          perf1.clear_caches()

          t1=time.perf_counter()
          v6_data=v31.compute_horary(**kwargs)
          v6_seconds=time.perf_counter()-t1
          print(f"THROTTLED_V6_SECONDS={v6_seconds:.6f}")
          print("THROTTLED_V6_ENGINE=", (v6_data.get("meta") or {}).get("horary_engine"))
          print("THROTTLED_V6_GRADE=", ((v6_data.get("judgment_support") or {}).get("traditional_core_v6") or {}).get("evidence_grade"))
          assert (v6_data.get("meta") or {}).get("horary_engine") == v6.VERSION
          assert (v6_data.get("judgment_support") or {}).get("traditional_core_v6")
          print(f"V6_OVER_V5_RATIO={v6_seconds / max(v5_seconds, 1e-9):.3f}x")
          PY
