name: QA Horary V2.1 Targeted

on:
  push:
    branches: [feat/horary-v2-judgment-structure]
    paths:
      - 'horary_future_window_v21.py'
      - 'horary_judgment_v2.py'
      - 'tests/test_horary_future_window_v2.py'
      - 'tests/test_horary_judgment_v2.py'
      - '.github/workflows/qa-horary-v21-targeted.yml'

jobs:
  targeted:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Syntax
        run: python -m py_compile horary_future_window_v21.py horary_judgment_v2.py tests/test_horary_future_window_v2.py tests/test_horary_judgment_v2.py
      - name: Future Window V2.1 regression
        run: python -m unittest -v tests.test_horary_future_window_v2
      - name: Judgment V2 regression
        run: python -m unittest -v tests.test_horary_judgment_v2
