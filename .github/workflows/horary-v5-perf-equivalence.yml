name: Verify Horary V5 perf equivalence

on:
  pull_request:
    branches: [main]

jobs:
  equivalence:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout base main
        uses: actions/checkout@v4
        with:
          ref: main
          path: base
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          path: head
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: head/requirements.txt
      - run: pip install -r head/requirements.txt
      - name: Compute base outputs
        working-directory: base
        shell: bash
        run: |
          python - <<'PY'
          import json, time
          import astro_api
          cases = [
              ("general","2026-10-06T18:35:00+09:00","여수"),
              ("relationship","2026-09-05T10:00","여수"),
              ("reconciliation","2026-09-02T08:30","서울"),
              ("contact","2026-10-01T23:15","여수"),
              ("money","2026-10-02T09:05","서울"),
              ("stock","2026-10-02T14:20","여수"),
              ("lost_object","2026-09-05T07:07","여수"),
              ("career","2026-08-25T22:30","서울"),
          ]
          rows=[]
          t0=time.perf_counter()
          for i,(topic,moment,place) in enumerate(cases):
              rows.append(astro_api.compute_horary(
                  question_text=f"equivalence case {i}",
                  question_iso=moment,
                  topic=topic,
                  timezone_name="Asia/Seoul",
                  place=place,
              ))
          print(f"BASE_SECONDS={time.perf_counter()-t0:.6f}")
          with open("/tmp/base-horary.json","w",encoding="utf-8") as f:
              json.dump(rows,f,ensure_ascii=False,sort_keys=True,separators=(",",":"))
          PY
      - name: Compute candidate outputs
        working-directory: head
        shell: bash
        run: |
          python - <<'PY'
          import json, time
          import astro_api
          cases = [
              ("general","2026-10-06T18:35:00+09:00","여수"),
              ("relationship","2026-09-05T10:00","여수"),
              ("reconciliation","2026-09-02T08:30","서울"),
              ("contact","2026-10-01T23:15","여수"),
              ("money","2026-10-02T09:05","서울"),
              ("stock","2026-10-02T14:20","여수"),
              ("lost_object","2026-09-05T07:07","여수"),
              ("career","2026-08-25T22:30","서울"),
          ]
          rows=[]
          t0=time.perf_counter()
          for i,(topic,moment,place) in enumerate(cases):
              rows.append(astro_api.compute_horary(
                  question_text=f"equivalence case {i}",
                  question_iso=moment,
                  topic=topic,
                  timezone_name="Asia/Seoul",
                  place=place,
              ))
          print(f"HEAD_SECONDS={time.perf_counter()-t0:.6f}")
          with open("/tmp/head-horary.json","w",encoding="utf-8") as f:
              json.dump(rows,f,ensure_ascii=False,sort_keys=True,separators=(",",":"))
          PY
      - name: Require byte-identical JSON
        shell: bash
        run: |
          cmp /tmp/base-horary.json /tmp/head-horary.json
          echo "HORARY_OUTPUT_EXACT_EQUAL=true"
