name: One-off ingress refinement request cache

on:
  pull_request:
    branches:
      - chore/ingress-refine-request-cache-base

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout base
        uses: actions/checkout@v4
        with:
          ref: chore/ingress-refine-request-cache-base
          path: base
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          path: head
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: head/requirements.txt
      - run: pip install -r head/requirements.txt
      - name: Compare advanced and production V5 outputs
        shell: bash
        run: |
          cat >/tmp/run_advanced.py <<'PY'
          import json,sys,time
          sys.path.insert(0,sys.argv[1])
          import astro_core as core
          import horary_topic_routes_v3
          import horary_engine_v6
          import horary_engine_v7
          import horary_engine_v8
          import horary_future_window_v2
          import horary_future_window_v21
          import horary_judgment_v2
          import horary_balance_v31 as v31
          import horary_performance_v2 as perf2
          import horary_performance_v1 as perf1
          perf2.install_future_window()
          cases=[
            ("contact","2026-10-05T18:25:23+09:00","A는 2026년 10월 31일까지 나에게 먼저 사적인 연락을 해올까요?"),
            ("stock","2026-09-30T22:18:00+09:00","10/1~10/2 보유주식 수익실현 가능한가요?"),
          ]
          core.load_ephemeris()
          rows=[]; t0=time.perf_counter()
          for topic,moment,q in cases:
              perf2.clear_caches(); perf1.clear_caches()
              rows.append(v31.compute_horary(
                  question_text=q,question_iso=moment,topic=topic,
                  timezone_name="Asia/Seoul",place="현재 위치",
                  lat=34.7594,lon=127.6530))
          print(f"SECONDS={time.perf_counter()-t0:.6f}")
          print("CACHE_INFO="+json.dumps(perf2.cache_info(),sort_keys=True))
          print(json.dumps(rows,ensure_ascii=False,sort_keys=True,separators=(",",":")))
          PY

          cat >/tmp/run_v5.py <<'PY'
          import json,sys,time
          sys.path.insert(0,sys.argv[1])
          import horary_topic_routes_v3
          import horary_balance_v31 as v31
          t0=time.perf_counter()
          out=v31.compute_horary(
              question_text="이 일은 실제로 성사될까요?",
              question_iso="2026-09-04T15:00:00+09:00",
              topic="general",timezone_name="Asia/Seoul",
              place="현재 위치",lat=34.7594,lon=127.6530)
          print(f"SECONDS={time.perf_counter()-t0:.6f}")
          print(json.dumps(out,ensure_ascii=False,sort_keys=True,separators=(",",":")))
          PY

          (cd base && python /tmp/run_advanced.py "$PWD" >/tmp/base-advanced.out)
          (cd head && python /tmp/run_advanced.py "$PWD" >/tmp/head-advanced.out)
          echo "BASE_ADVANCED_$(head -n 1 /tmp/base-advanced.out)"
          echo "HEAD_ADVANCED_$(head -n 1 /tmp/head-advanced.out)"
          grep '^CACHE_INFO=' /tmp/head-advanced.out
          tail -n 1 /tmp/base-advanced.out >/tmp/base-advanced.json
          tail -n 1 /tmp/head-advanced.out >/tmp/head-advanced.json
          cmp /tmp/base-advanced.json /tmp/head-advanced.json
          echo "INGRESS_REFINE_CACHE_ADVANCED_OUTPUT_EXACT_EQUAL=true"

          (cd base && python /tmp/run_v5.py "$PWD" >/tmp/base-v5.out)
          (cd head && python /tmp/run_v5.py "$PWD" >/tmp/head-v5.out)
          echo "BASE_V5_$(head -n 1 /tmp/base-v5.out)"
          echo "HEAD_V5_$(head -n 1 /tmp/head-v5.out)"
          tail -n 1 /tmp/base-v5.out >/tmp/base-v5.json
          tail -n 1 /tmp/head-v5.out >/tmp/head-v5.json
          cmp /tmp/base-v5.json /tmp/head-v5.json
          echo "PRODUCTION_V5_INGRESS_REFINE_OUTPUT_EXACT_EQUAL=true"
