name: One-off production V6 canary smoke

on:
  pull_request:
    branches:
      - chore/v6-prod-canary-smoke-base

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Production V5 -> persistent isolated V6 -> V5
        shell: bash
        env:
          BASE_URL: https://lunea-astro-api-v2.onrender.com
          CANARY_TOKEN: public-smoke-d23e-7c4b9e2a
        run: |
          set -euo pipefail
          PAYLOAD='{"question_text":"이 일은 실제로 성사될까요?","question_iso":"2026-09-04T15:00:00+09:00","topic":"general","timezone":"Asia/Seoul","place":"현재 위치","lat":34.7594,"lon":127.6530}'

          unauthorized=$(curl -sS -o /tmp/unauth.json -w '%{http_code}'             -H 'Content-Type: application/json'             --data "$PAYLOAD"             "$BASE_URL/v1/horary/canary-v6")
          echo "CANARY_UNAUTHORIZED_HTTP=$unauthorized"
          test "$unauthorized" = "404"

          v5_before=$(curl -sS -o /tmp/v5-before.json -w '%{http_code} %{time_total}'             -H 'Content-Type: application/json'             --data "$PAYLOAD"             "$BASE_URL/v1/horary")
          echo "V5_BEFORE_HTTP_TIME=$v5_before"

          v6_first=$(curl -sS -o /tmp/v6-first.json -w '%{http_code} %{time_total}'             -H 'Content-Type: application/json'             -H "X-LUNEA-Canary: $CANARY_TOKEN"             --data "$PAYLOAD"             "$BASE_URL/v1/horary/canary-v6")
          echo "V6_CANARY_FIRST_HTTP_TIME=$v6_first"

          v6_second=$(curl -sS -o /tmp/v6-second.json -w '%{http_code} %{time_total}'             -H 'Content-Type: application/json'             -H "X-LUNEA-Canary: $CANARY_TOKEN"             --data "$PAYLOAD"             "$BASE_URL/v1/horary/canary-v6")
          echo "V6_CANARY_SECOND_HTTP_TIME=$v6_second"

          v5_after=$(curl -sS -o /tmp/v5-after.json -w '%{http_code} %{time_total}'             -H 'Content-Type: application/json'             --data "$PAYLOAD"             "$BASE_URL/v1/horary")
          echo "V5_AFTER_HTTP_TIME=$v5_after"

          python - <<'PY'
          import json
          before=json.load(open('/tmp/v5-before.json'))
          first=json.load(open('/tmp/v6-first.json'))
          second=json.load(open('/tmp/v6-second.json'))
          after=json.load(open('/tmp/v5-after.json'))

          b=(before.get('meta') or {}).get('horary_engine')
          r1=first.get('result') or {}
          r2=second.get('result') or {}
          e1=(r1.get('meta') or {}).get('horary_engine')
          e2=(r2.get('meta') or {}).get('horary_engine')
          m1=first.get('canary') or {}
          m2=second.get('canary') or {}
          a=(after.get('meta') or {}).get('horary_engine')

          print('V5_BEFORE_ENGINE='+str(b))
          print('V6_CANARY_FIRST_ENGINE='+str(e1))
          print('V6_CANARY_FIRST_PARENT_SECONDS='+str(m1.get('elapsed_seconds')))
          print('V6_CANARY_FIRST_COMPUTE_SECONDS='+str(m1.get('worker_compute_seconds')))
          print('V6_CANARY_FIRST_WORKER_STARTED='+str(m1.get('worker_started')))
          print('V6_CANARY_SECOND_ENGINE='+str(e2))
          print('V6_CANARY_SECOND_PARENT_SECONDS='+str(m2.get('elapsed_seconds')))
          print('V6_CANARY_SECOND_COMPUTE_SECONDS='+str(m2.get('worker_compute_seconds')))
          print('V6_CANARY_SECOND_WORKER_STARTED='+str(m2.get('worker_started')))
          print('V6_CANARY_PROCESS_ISOLATED='+str(m2.get('process_isolated')))
          print('V5_AFTER_ENGINE='+str(a))

          assert b == 'LUNEA_HORARY_ENGINE_V5_MOIETY_SECT'
          assert first.get('schema') == 'LUNEA_HORARY_CANARY_V6_V1'
          assert second.get('schema') == 'LUNEA_HORARY_CANARY_V6_V1'
          assert e1 == 'LUNEA_HORARY_ENGINE_V6_STRICT_TRADITIONAL_CORE'
          assert e2 == 'LUNEA_HORARY_ENGINE_V6_STRICT_TRADITIONAL_CORE'
          assert m1.get('worker_persistent') is True
          assert m2.get('worker_persistent') is True
          assert m2.get('worker_started') is False
          assert m2.get('process_isolated') is True
          assert a == 'LUNEA_HORARY_ENGINE_V5_MOIETY_SECT'
          print('PRODUCTION_V6_PERSISTENT_CANARY_CONFIRMED=true')
          PY
