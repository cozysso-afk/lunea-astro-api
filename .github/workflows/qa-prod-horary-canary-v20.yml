name: QA Production Horary Canary V20

on:
  push:
    branches: [qa/prod-horary-canary-v20]

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Time direct V2 Horary route
        shell: bash
        run: |
          python - <<'PY'
          import json
          import time
          import urllib.request

          URL = "https://lunea-astro-api-v2.onrender.com/v1/horary"
          payload = {
              "question_text": "A는 2026년 10월 31일까지 나에게 먼저 사적인 연락을 해올까요?",
              "question_iso": "2026-10-05T18:25:23+09:00",
              "topic": "contact",
              "timezone": "Asia/Seoul",
              "place": "현재 위치",
              "lat": 34.7594,
              "lon": 127.6530,
          }

          body = json.dumps(payload, ensure_ascii=False).encode("utf-8")
          req = urllib.request.Request(URL, data=body, method="POST")
          req.add_header("Content-Type", "application/json")
          req.add_header("Accept", "application/json")
          t0 = time.monotonic()
          with urllib.request.urlopen(req, timeout=360) as resp:
              data = json.loads(resp.read().decode("utf-8"))
              elapsed = time.monotonic() - t0
              print(f"V2_DIRECT_HTTP_STATUS={resp.status}")
              print(f"V2_DIRECT_TOTAL_SECONDS={elapsed:.6f}")
          assert data.get("schema") == "LUNEA_HORARY_V1", data.get("schema")
          assert (data.get("judgment_support") or {}).get("horary_v2")
          PY
