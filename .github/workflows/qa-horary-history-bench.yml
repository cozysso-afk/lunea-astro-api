name: QA Horary History Bench

on:
  push:
    branches: [qa/prod-horary-canary-v20]

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: pre_v6
            ref: 82742092048f85f763441214eb942ae7a3f7fada
          - label: v6_initial
            ref: 94a84f63348d1df621301497d21b549f26664e60
          - label: v7_initial
            ref: 7c086bebffaa2f2869c014106ded9c1680adf0cd
          - label: v7_fix
            ref: b09ef8fefcf75e7bf659cb06b4157d5540379e42
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -r requirements.txt
      - name: Time one Horary
        shell: bash
        run: |
          python - <<'PY'
          import time
          import astro_core as core
          core.load_ephemeris()
          try:
              import horary_topic_routes_v3  # noqa
          except Exception:
              pass
          from horary_balance_v31 import compute_horary
          t0=time.perf_counter()
          data=compute_horary(
              question_text='A는 2026년 10월 31일까지 나에게 먼저 사적인 연락을 해올까요?',
              question_iso='2026-10-05T18:25:23+09:00',
              topic='contact',
              timezone_name='Asia/Seoul',
              place='현재 위치',
              lat=34.7594,
              lon=127.6530,
          )
          elapsed=time.perf_counter()-t0
          print('HISTORY_LABEL=${{ matrix.label }}')
          print(f'HISTORY_TOTAL_SECONDS={elapsed:.6f}')
          print('HISTORY_SCHEMA=' + str(data.get('schema')))
          PY
