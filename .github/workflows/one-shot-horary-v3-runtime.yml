name: One-shot Horary V3 runtime validation

on:
  push:
    branches: [feature/horary-balance-v3]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime dependencies
        run: pip install -r requirements.txt
      - name: Run real ephemeris Horary V3 cases
        shell: bash
        run: |
          python3 - <<'PY'
          import time
          import json
          from horary_balance_v3 import compute_horary

          cases = [
              ('reconciliation', '그 사람과 다시 관계가 회복될 가능성이 있을까?'),
              ('exam', '이번 시험에서 합격 결과를 받을 수 있을까?'),
              ('purchase', '지금 고민 중인 물건을 사는 선택이 괜찮을까?'),
              ('friend', '이 친구와 관계가 다시 편해질 수 있을까?'),
          ]

          rows = []
          total_start = time.perf_counter()
          for topic, question in cases:
              started = time.perf_counter()
              data = compute_horary(
                  question_text=question,
                  question_iso='2026-09-02T08:41',
                  topic=topic,
                  timezone_name='Asia/Seoul',
                  place='서울',
              )
              elapsed = time.perf_counter() - started
              assert data.get('schema') == 'LUNEA_HORARY_V1', data.get('schema')
              balance = (data.get('judgment_support') or {}).get('balance_v3') or {}
              assert balance.get('version') == 'LUNEA_HORARY_BALANCE_V3', balance
              assert balance.get('tier'), balance
              perfection = (data.get('judgment_support') or {}).get('perfection') or {}
              rows.append({
                  'topic': topic,
                  'seconds': round(elapsed, 3),
                  'tier': balance.get('tier'),
                  'headline': balance.get('headline_ko'),
                  'perfection_reason': perfection.get('reason'),
                  'support_score': balance.get('support_score'),
                  'constraint_score': balance.get('constraint_score'),
                  'quesited_house': ((data.get('significators') or {}).get('quesited') or {}).get('house'),
                  'event_house': ((data.get('significators') or {}).get('event') or {}).get('house'),
              })
          total = time.perf_counter() - total_start
          print(json.dumps({'total_seconds': round(total, 3), 'cases': rows}, ensure_ascii=False, indent=2))
          # This is a regression guard, not a strict production SLA. A warmed test
          # should not take multiple minutes after the chunked sign-change scan.
          assert total < 120, f'Horary V3 runtime regression: {total:.1f}s for {len(cases)} cases'
          PY
      - name: Remove one-shot workflow
        if: success()
        shell: bash
        run: |
          rm -f .github/workflows/one-shot-horary-v3-runtime.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: remove one-shot Horary runtime validator"
          git push
