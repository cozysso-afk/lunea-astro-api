name: Isolated V6 strict memo equivalence

on:
  pull_request:
    branches:
      - chore/v6-benchmark-base

jobs:
  equivalence:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout base
        uses: actions/checkout@v4
        with:
          ref: chore/v6-benchmark-base
          path: base
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          path: head
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: head/requirements.txt
      - run: pip install -r head/requirements.txt
      - name: Compute base and candidate V6 outputs
        shell: bash
        run: |
          cat >/tmp/run_v6.py <<'PY'
          import json, sys, time
          sys.path.insert(0, sys.argv[1])

          import astro_core as core
          import horary_topic_routes_v3
          import horary_engine_v6 as v6
          import horary_performance_v2 as perf2
          import horary_performance_v1 as perf1
          import horary_balance_v31 as v31

          cases = [
              dict(question_text="A는 2026년 10월 31일까지 나에게 먼저 사적인 연락을 해올까요?", question_iso="2026-10-05T18:25:23+09:00", topic="contact", timezone_name="Asia/Seoul", place="현재 위치", lat=34.7594, lon=127.6530),
              dict(question_text="이 일은 실제로 성사될까요?", question_iso="2026-09-04T15:00:00+09:00", topic="general", timezone_name="Asia/Seoul", place="여수"),
              dict(question_text="어려움이 있어도 이 일은 성사될까요?", question_iso="2026-09-06T15:00:00+09:00", topic="general", timezone_name="Asia/Seoul", place="여수"),
              dict(question_text="이미 지나간 흐름이 다시 성사각으로 잡히나요?", question_iso="2026-09-05T01:00:00+09:00", topic="general", timezone_name="Asia/Seoul", place="여수"),
          ]

          core.load_ephemeris()
          rows=[]
          started=time.perf_counter()
          for case in cases:
              perf2.clear_caches()
              perf1.clear_caches()
              rows.append(v31.compute_horary(**case))
          elapsed=time.perf_counter()-started

          print(f"SECONDS={elapsed:.6f}")
          print(json.dumps(rows,ensure_ascii=False,sort_keys=True,separators=(",",":")))
          PY

          (cd base && python /tmp/run_v6.py "$PWD" > /tmp/base.out)
          (cd head && python /tmp/run_v6.py "$PWD" > /tmp/head.out)

          echo "BASE_$(head -n 1 /tmp/base.out)"
          echo "HEAD_$(head -n 1 /tmp/head.out)"
          tail -n 1 /tmp/base.out > /tmp/base.json
          tail -n 1 /tmp/head.out > /tmp/head.json
          cmp /tmp/base.json /tmp/head.json
          echo "V6_STRICT_MEMO_OUTPUT_EXACT_EQUAL=true"
