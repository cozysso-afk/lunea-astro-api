name: Test Horary Balance V3

on:
  push:
    branches: [main, feature/horary-balance-v3, feat/horary-balance-v3-1, feat/thai-taksa-range-v18, fix/horary-engine-moiety-sect-golden-20260905, feat/horary-v2-judgment-structure]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Syntax check
        run: python -m py_compile astro_api.py astro_core.py astro_jobs_v1.py horary_balance_v3.py horary_balance_v31.py horary_topic_routes_v3.py horary_engine_v5.py horary_engine_v6.py horary_engine_v7.py horary_engine_v8.py horary_future_window_v2.py horary_future_window_v21.py horary_judgment_v2.py horary_performance_v1.py vedic_core.py vedic_api.py prashna_core.py prashna_api.py cross_interpretation_v2.py cross_interpretation_api_v2.py tests/test_horary_future_window_v2.py tests/test_horary_judgment_v2.py tests/test_horary_performance_v1.py tests/profile_horary_hotspots_v1.py
      - name: Horary cold one-shot hotspot profile
        run: python tests/profile_horary_hotspots_v1.py
      - name: Horary V3 regression tests
        run: python -m unittest -v tests.test_horary_balance_v3
      - name: Horary V3.1 traditional-pattern tests
        run: python -m unittest -v tests.test_horary_balance_v31
      - name: Horary V4 condition/location enrichment tests
        run: python -m unittest -v tests.test_horary_enrichment_v4
      - name: Horary V5 moiety/sect/golden ephemeris tests
        run: python -m unittest -v tests.test_horary_engine_v5
      - name: Horary V6 strict traditional-core tests
        run: python -m unittest -v tests.test_horary_engine_v6
      - name: Horary V7 bias/dignity/Moon/route tests
        run: python -m unittest -v tests.test_horary_engine_v7
      - name: Horary V8 judgment-hierarchy tests
        run: python -m unittest -v tests.test_horary_engine_v8
      - name: Horary Future Window V2.1 completeness regression
        run: python -m unittest -v tests.test_horary_future_window_v2
      - name: Horary V2 judgment/evidence schema tests
        run: python -m unittest -v tests.test_horary_judgment_v2
      - name: Horary performance memo/dedupe regression
        run: python -m unittest -v tests.test_horary_performance_v1
      - name: Real ephemeris translation/collection/intervention goldens
        run: python -m unittest -v tests.test_horary_patterns_real_v7
      - name: Thai Taksa range calendar tests
        run: python -m unittest -v tests.test_thai_taksa_range
      - name: Prashna V1 sidereal/sunrise-boundary tests
        run: python -m unittest -v tests.test_prashna_core_v1
      - name: Horary Prashna Cross Interpretation V2 golden tests
        run: python -m unittest -v tests.test_cross_interpretation_v2
      - name: Render Docker image smoke build
        run: docker build --tag lunea-astro-api:ci .
