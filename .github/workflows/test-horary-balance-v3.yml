name: Test Horary Balance V3

on:
  push:
    branches: [main, feature/horary-balance-v3, feat/horary-balance-v3-1, feat/thai-taksa-range-v18, fix/horary-engine-moiety-sect-golden-20260905]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Syntax check
        run: python -m py_compile astro_api.py astro_core.py horary_balance_v3.py horary_balance_v31.py horary_topic_routes_v3.py horary_engine_v5.py horary_engine_v6.py horary_engine_v7.py
      - name: Horary V3 regression tests
        run: python -m unittest -v tests.test_horary_balance_v3
      - name: Horary V3.1 traditional-pattern tests
        run: python -m unittest -v tests.test_horary_balance_v31
      - name: Horary V4 condition/location enrichment tests
        run: python -m unittest -v tests.test_horary_enrichment_v4
      - name: Horary V5 moiety/sect/golden ephemeris tests
        run: python -m unittest -v tests.test_horary_engine_v5
      - name: Horary V6 strict traditional-core tests
        run: python -m unittest -v tests.test_horary_engine_v6
      - name: Horary V7 bias/dignity/Moon/route tests
        run: python -m unittest -v tests.test_horary_engine_v7
      - name: Thai Taksa range calendar tests
        run: python -m unittest -v tests.test_thai_taksa_range
      - name: Render Docker image smoke build
        run: docker build --tag lunea-astro-api:ci .
