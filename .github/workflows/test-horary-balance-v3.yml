name: Test Horary Balance V3

on:
  push:
    branches: [main, feature/horary-balance-v3, feat/horary-balance-v3-1]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Syntax check
        run: python -m py_compile astro_api.py astro_core.py horary_balance_v3.py horary_balance_v31.py horary_topic_routes_v3.py
      - name: Horary V3 regression tests
        run: python -m unittest -v tests.test_horary_balance_v3
      - name: Horary V3.1 traditional-pattern tests
        run: python -m unittest -v tests.test_horary_balance_v31
      - name: Render Docker image smoke build
        run: docker build --tag lunea-astro-api:ci .
