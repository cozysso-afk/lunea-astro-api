name: One-off pure V6 comparison

on:
  pull_request:
    branches:
      - chore/v6-benchmark-base

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Compare production V5 and pure V6
        shell: bash
        run: |
          python - <<'PY'
          import time
          import astro_core as core
          import horary_topic_routes_v3  # V4 -> production V5
          import horary_balance_v31 as v31

          kwargs = dict(
              question_text="A는 2026년 10월 31일까지 나에게 먼저 사적인 연락을 해올까요?",
              question_iso="2026-10-05T18:25:23+09:00",
              topic="contact",
              timezone_name="Asia/Seoul",
              place="현재 위치",
              lat=34.7594,
              lon=127.6530,
          )

          core.load_ephemeris()

          t0=time.perf_counter()
          v5=v31.compute_horary(**kwargs)
          v5_seconds=time.perf_counter()-t0
          print(f"PURE_COMPARE_V5_SECONDS={v5_seconds:.6f}")
          print("PURE_COMPARE_V5_ENGINE=", (v5.get("meta") or {}).get("horary_engine"))

          import horary_engine_v6 as v6  # explicit V6 patch only; no perf v1/v2

          t0=time.perf_counter()
          out=v31.compute_horary(**kwargs)
          v6_seconds=time.perf_counter()-t0
          print(f"PURE_COMPARE_V6_SECONDS={v6_seconds:.6f}")
          print("PURE_COMPARE_V6_ENGINE=", (out.get("meta") or {}).get("horary_engine"))
          print(f"PURE_COMPARE_V6_INCREMENT={v6_seconds-v5_seconds:.6f}")
          print(f"PURE_COMPARE_RATIO={v6_seconds/v5_seconds:.3f}x")

          assert (v5.get("meta") or {}).get("horary_engine") == "LUNEA_HORARY_ENGINE_V5_MOIETY_SECT"
          assert (out.get("meta") or {}).get("horary_engine") == v6.VERSION
          assert "traditional_core_v6" in (out.get("judgment_support") or {})
          PY
