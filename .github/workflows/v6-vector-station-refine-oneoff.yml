name: One-off V6 optimized profile

on:
  pull_request:
    branches:
      - chore/v6-chunked-station-benchmark-base

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Profile optimized V6
        shell: bash
        run: |
          python - <<'PY'
          import cProfile
          import io
          import pstats
          import sys
          import time

          import astro_core as core
          import horary_topic_routes_v3
          import horary_engine_v6 as v6
          import horary_balance_v31 as v31
          import horary_performance_v2 as perf2
          import horary_performance_v1 as perf1

          assert "horary_future_window_v2" not in sys.modules

          kwargs = dict(
              question_text="A는 2026년 10월 31일까지 나에게 먼저 사적인 연락을 해올까요?",
              question_iso="2026-10-05T18:25:23+09:00",
              topic="contact",
              timezone_name="Asia/Seoul",
              place="현재 위치",
              lat=34.7594,
              lon=127.6530,
          )

          core.load_ephemeris()
          perf2.clear_caches()
          perf1.clear_caches()

          profiler=cProfile.Profile()
          t0=time.perf_counter()
          profiler.enable()
          out=v31.compute_horary(**kwargs)
          profiler.disable()
          elapsed=time.perf_counter()-t0

          print(f"OPTIMIZED_V6_PROFILE_SECONDS={elapsed:.6f}")
          print("OPTIMIZED_V6_PROFILE_ENGINE=", (out.get("meta") or {}).get("horary_engine"))
          assert (out.get("meta") or {}).get("horary_engine") == v6.VERSION
          assert "horary_future_window_v2" not in sys.modules

          buf=io.StringIO()
          pstats.Stats(profiler,stream=buf).strip_dirs().sort_stats("cumulative").print_stats(70)
          print("OPTIMIZED_V6_CPROFILE_BEGIN")
          print(buf.getvalue())
          print("OPTIMIZED_V6_CPROFILE_END")
          PY
