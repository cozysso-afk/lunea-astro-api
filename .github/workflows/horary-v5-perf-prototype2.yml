name: One-off Horary V5 perf prototype 2

on:
  pull_request:
    branches: [main]

jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Profile current V5 and prototype batching
        shell: bash
        run: |
          python - <<'PY'
          import copy
          import time
          from contextvars import ContextVar
          from datetime import timedelta
          import numpy as np

          import astro_api
          import astro_core as core

          cases = [
              dict(question_text="p2-general", question_iso="2026-10-06T18:35:00+09:00", topic="general", timezone_name="Asia/Seoul", place="여수"),
              dict(question_text="p2-contact", question_iso="2026-10-01T23:15:00+09:00", topic="contact", timezone_name="Asia/Seoul", place="여수"),
              dict(question_text="p2-recon", question_iso="2026-09-02T08:30:00+09:00", topic="reconciliation", timezone_name="Asia/Seoul", place="서울"),
              dict(question_text="p2-stock", question_iso="2026-10-02T14:20:00+09:00", topic="stock", timezone_name="Asia/Seoul", place="여수"),
          ]

          # Warm ephemeris and imports.
          astro_api.compute_horary(**cases[0])

          original_lon = core.get_tropical_ecliptic_lon
          original_lons = core.get_tropical_ecliptic_lons
          original_motion = core.planet_motion

          def run(label):
              outputs=[]
              t0=time.perf_counter()
              for case in cases:
                  outputs.append(astro_api.compute_horary(**case))
              elapsed=time.perf_counter()-t0
              print(f"{label}_SECONDS={elapsed:.6f}")
              return outputs, elapsed

          baseline, base_seconds = run("BASELINE")

          # A) Batch the exact same past/now/future timestamps used by planet_motion.
          def vector_motion(body, dt_utc):
              window_hours = 0.25 if body == "Moon" else 1.0 if body in {"Sun","Mercury","Venus","Mars"} else 6.0
              times = [
                  dt_utc - timedelta(hours=window_hours),
                  dt_utc,
                  dt_utc + timedelta(hours=window_hours),
              ]
              values = np.asarray(core.get_tropical_ecliptic_lons(body, times), dtype=float)
              past, now, future = map(float, values)
              speed = core.circular_delta(future, past) / ((2 * window_hours) / 24.0)
              direction = "순행" if speed > 0.002 else "역행" if speed < -0.002 else "정지권"
              return now, float(speed), direction

          core.planet_motion = vector_motion
          motion_outputs, motion_seconds = run("VECTOR_MOTION")
          print("VECTOR_MOTION_EXACT_EQUAL=", baseline == motion_outputs)

          # Restore and install B) request-local exact vector-grid cache.
          core.planet_motion = original_motion
          vector_cache_var = ContextVar("horary_v5_vector_cache", default=None)
          stats={"hit":0,"miss":0}

          def cached_lons(body, datetimes_utc):
              seq=list(datetimes_utc)
              cache=vector_cache_var.get()
              if cache is None:
                  return original_lons(body,seq)
              key=(str(body),tuple(x.astimezone(core.UTC).isoformat() for x in seq))
              cached=cache.get(key)
              if cached is not None:
                  stats["hit"]+=1
                  return cached.copy()
              stats["miss"]+=1
              value=np.asarray(original_lons(body,seq),dtype=float)
              cache[key]=value.copy()
              return value

          core.get_tropical_ecliptic_lons = cached_lons

          def run_cached(label, use_motion=False):
              if use_motion:
                  core.planet_motion = vector_motion
              else:
                  core.planet_motion = original_motion
              outputs=[]
              t0=time.perf_counter()
              for case in cases:
                  token=vector_cache_var.set({})
                  try:
                      outputs.append(astro_api.compute_horary(**case))
                  finally:
                      vector_cache_var.reset(token)
              elapsed=time.perf_counter()-t0
              print(f"{label}_SECONDS={elapsed:.6f}")
              print(f"{label}_CACHE_STATS={stats}")
              return outputs,elapsed

          cache_outputs, cache_seconds = run_cached("VECTOR_CACHE", False)
          print("VECTOR_CACHE_EXACT_EQUAL=", baseline == cache_outputs)

          stats["hit"]=stats["miss"]=0
          both_outputs, both_seconds = run_cached("BOTH", True)
          print("BOTH_EXACT_EQUAL=", baseline == both_outputs)
          print(f"MOTION_SPEEDUP={base_seconds/motion_seconds:.3f}x")
          print(f"CACHE_SPEEDUP={base_seconds/cache_seconds:.3f}x")
          print(f"BOTH_SPEEDUP={base_seconds/both_seconds:.3f}x")

          if baseline != motion_outputs:
              print("VECTOR_MOTION_REJECTED")
          if baseline != cache_outputs:
              raise SystemExit("vector cache changed output")
          if baseline != both_outputs:
              print("BOTH_REJECTED")

          # C) Request-local per-time-point cache: reuse overlapping vector grids,
          # while batching only the missing timestamps in one Skyfield call.
          core.get_tropical_ecliptic_lons = original_lons
          core.planet_motion = original_motion
          point_cache_var = ContextVar("horary_v5_point_cache", default=None)
          pstats={"hit":0,"miss":0,"batches":0}

          def point_cached_lons(body, datetimes_utc):
              seq=list(datetimes_utc)
              cache=point_cache_var.get()
              if cache is None:
                  return original_lons(body,seq)
              keys=[(str(body),x.astimezone(core.UTC).isoformat()) for x in seq]
              missing_positions=[]
              missing_times=[]
              for i,key in enumerate(keys):
                  if key in cache:
                      pstats["hit"]+=1
                  else:
                      pstats["miss"]+=1
                      missing_positions.append(i)
                      missing_times.append(seq[i])
              if missing_times:
                  pstats["batches"]+=1
                  values=np.asarray(original_lons(body,missing_times),dtype=float)
                  for pos,value in zip(missing_positions,values):
                      cache[keys[pos]]=float(value)
              return np.asarray([cache[key] for key in keys],dtype=float)

          core.get_tropical_ecliptic_lons = point_cached_lons

          def run_point(label, use_motion=False):
              core.planet_motion = vector_motion if use_motion else original_motion
              outputs=[]
              t0=time.perf_counter()
              for case in cases:
                  token=point_cache_var.set({})
                  try:
                      outputs.append(astro_api.compute_horary(**case))
                  finally:
                      point_cache_var.reset(token)
              elapsed=time.perf_counter()-t0
              print(f"{label}_SECONDS={elapsed:.6f}")
              print(f"{label}_CACHE_STATS={pstats}")
              return outputs,elapsed

          point_outputs, point_seconds = run_point("POINT_CACHE", False)
          print("POINT_CACHE_EXACT_EQUAL=", baseline == point_outputs)
          pstats["hit"]=pstats["miss"]=pstats["batches"]=0
          point_both_outputs, point_both_seconds = run_point("POINT_BOTH", True)
          print("POINT_BOTH_EXACT_EQUAL=", baseline == point_both_outputs)
          print(f"POINT_CACHE_SPEEDUP={base_seconds/point_seconds:.3f}x")
          print(f"POINT_BOTH_SPEEDUP={base_seconds/point_both_seconds:.3f}x")
          if baseline != point_outputs:
              print("POINT_CACHE_REJECTED")
          if baseline != point_both_outputs:
              print("POINT_BOTH_REJECTED")

          # Profile one representative case with the best exact-output prototype active.
          import cProfile, io, pstats as py_pstats
          profiler=cProfile.Profile()
          token=point_cache_var.set({})
          try:
              profiler.enable()
              astro_api.compute_horary(**cases[0])
              profiler.disable()
          finally:
              point_cache_var.reset(token)
          out=io.StringIO()
          py_pstats.Stats(profiler,stream=out).sort_stats("cumulative").print_stats(80)
          print("POINT_BOTH_CPROFILE_BEGIN")
          print(out.getvalue())
          print("POINT_BOTH_CPROFILE_END")

          # D) Share one Skyfield Earth/time evaluation across both bodies for
          # the same sample grid, while preserving the same timestamps/search.
          import horary_balance_v3 as v3
          original_sample=v3._sample_until_first_sign_change
          original_refine=core._horary_refine_pair

          def many_lons(body_names, datetimes_utc):
              seq=list(datetimes_utc)
              if not seq:
                  return {body: np.asarray([],dtype=float) for body in body_names}
              cache=point_cache_var.get()
              if cache is None:
                  cache={}
              # Use one union time axis. Prefill/cache every requested body at
              # these timestamps so later overlapping scans can reuse points.
              keys=[x.astimezone(core.UTC).isoformat() for x in seq]
              missing_any=False
              for body in body_names:
                  if any((str(body),key) not in cache for key in keys):
                      missing_any=True
                      break
              if missing_any:
                  ts, _, earth, targets, _, _, _ = core.load_ephemeris()
                  times=ts.from_datetimes([x.astimezone(core.UTC) for x in seq])
                  observer=earth.at(times)
                  for body in body_names:
                      body_keys=[(str(body),key) for key in keys]
                      if all(key in cache for key in body_keys):
                          continue
                      apparent=observer.observe(targets[body]).apparent()
                      _, lon, _ = apparent.frame_latlon(core.ecliptic_frame)
                      arr=np.ravel(np.asarray(lon.degrees,dtype=float))
                      if arr.size != len(seq):
                          raise ValueError("many longitude shape mismatch")
                      for key,value in zip(body_keys,arr):
                          cache[key]=float(value % 360.0)
              return {
                  body: np.asarray([cache[(str(body),key)] for key in keys],dtype=float)
                  for body in body_names
              }

          def sample_many(body_a,row_a,body_b,row_b,dt_utc,horizon_days,step_hours):
              end_dt=dt_utc+timedelta(days=float(horizon_days))
              max_speed=max(abs(float(row_a.get("speed_deg_per_day") or 0.0)),abs(float(row_b.get("speed_deg_per_day") or 0.0)))
              chunk_days=3.0 if "Moon" in {body_a,body_b} else 10.0 if max_speed>=0.45 else 30.0
              start_a_sign=int(float(row_a["longitude"])//30)
              start_b_sign=int(float(row_b["longitude"])//30)
              all_times=[]; all_a=[]; all_b=[]; cursor=dt_utc
              while cursor<end_dt:
                  chunk_end=min(end_dt,cursor+timedelta(days=chunk_days))
                  chunk_times=list(core._sample_datetimes(cursor,chunk_end,step_hours))
                  if all_times and chunk_times and chunk_times[0]==all_times[-1]:
                      chunk_times=chunk_times[1:]
                  if not chunk_times:
                      break
                  values=many_lons((body_a,body_b),chunk_times)
                  a_chunk=values[body_a]; b_chunk=values[body_b]
                  for t,a_lon,b_lon in zip(chunk_times,a_chunk,b_chunk):
                      if int(float(a_lon)//30)!=start_a_sign:
                          return all_times,np.asarray(all_a,dtype=float),np.asarray(all_b,dtype=float),body_a
                      if int(float(b_lon)//30)!=start_b_sign:
                          return all_times,np.asarray(all_a,dtype=float),np.asarray(all_b,dtype=float),body_b
                      all_times.append(t); all_a.append(float(a_lon)); all_b.append(float(b_lon))
                  cursor=chunk_end
              return all_times,np.asarray(all_a,dtype=float),np.asarray(all_b,dtype=float),None

          def refine_many(body_a,body_b,aspect_angle,left_dt,right_dt,iterations=12):
              def orbs(times):
                  vals=many_lons((body_a,body_b),times)
                  a=vals[body_a]; b=vals[body_b]
                  seps=np.abs((a-b+180.0)%360.0-180.0)
                  return np.abs(seps-float(aspect_angle))
              left,right=left_dt,right_dt
              for _ in range(iterations):
                  span=right-left
                  m1=left+span/3
                  m2=right-span/3
                  values=orbs([m1,m2])
                  if float(values[0])<=float(values[1]):
                      right=m2
                  else:
                      left=m1
              exact=left+(right-left)/2
              return exact,float(orbs([exact])[0])

          v3._sample_until_first_sign_change=sample_many
          core._horary_refine_pair=refine_many
          core.planet_motion=vector_motion
          pstats["hit"]=pstats["miss"]=pstats["batches"]=0
          many_outputs=[]
          t_many=time.perf_counter()
          for case in cases:
              token=point_cache_var.set({})
              try:
                  many_outputs.append(astro_api.compute_horary(**case))
              finally:
                  point_cache_var.reset(token)
          many_seconds=time.perf_counter()-t_many
          print(f"MANY_BOTH_SECONDS={many_seconds:.6f}")
          print("MANY_BOTH_EXACT_EQUAL=",baseline==many_outputs)
          print(f"MANY_BOTH_SPEEDUP={base_seconds/many_seconds:.3f}x")
          if baseline!=many_outputs:
              print("MANY_BOTH_REJECTED")

          profiler2=cProfile.Profile()
          token=point_cache_var.set({})
          try:
              profiler2.enable()
              astro_api.compute_horary(**cases[0])
              profiler2.disable()
          finally:
              point_cache_var.reset(token)
          out2=io.StringIO()
          py_pstats.Stats(profiler2,stream=out2).sort_stats("cumulative").print_stats(70)
          print("MANY_BOTH_CPROFILE_BEGIN")
          print(out2.getvalue())
          print("MANY_BOTH_CPROFILE_END")
          PY
