name: One-off Horary V5 pair batching

on:
  pull_request:
    branches: [main]

jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Compare shared pair ephemeris prototype
        shell: bash
        run: |
          python - <<'PY'
          from datetime import timedelta
          import time
          import numpy as np

          import astro_api
          import astro_core as core
          import horary_balance_v3 as v3
          import horary_engine_v5 as v5

          cases = [
              dict(question_text="pair-general", question_iso="2026-10-06T19:30:00+09:00", topic="general", timezone_name="Asia/Seoul", place="여수"),
              dict(question_text="pair-contact", question_iso="2026-10-01T23:15:00+09:00", topic="contact", timezone_name="Asia/Seoul", place="여수"),
              dict(question_text="pair-recon", question_iso="2026-09-02T08:30:00+09:00", topic="reconciliation", timezone_name="Asia/Seoul", place="서울"),
              dict(question_text="pair-stock", question_iso="2026-10-02T14:20:00+09:00", topic="stock", timezone_name="Asia/Seoul", place="여수"),
          ]

          astro_api.compute_horary(**cases[0])

          def run(label):
              rows=[]
              t0=time.perf_counter()
              for case in cases:
                  rows.append(astro_api.compute_horary(**case))
              elapsed=time.perf_counter()-t0
              print(f"{label}_SECONDS={elapsed:.6f}")
              return rows,elapsed

          baseline,base_seconds=run("BASELINE")

          original_sample=v3._sample_until_first_sign_change
          original_refine=core._horary_refine_pair
          original_scalar=core.get_tropical_ecliptic_lon

          stats={"pair_calls":0,"scalar_cache_hit":0,"scalar_cache_miss":0}

          def cache_key(body,dt):
              return str(body),dt.astimezone(core.UTC).isoformat()

          def pair_lons(body_a,body_b,datetimes):
              seq=list(datetimes)
              if not seq:
                  return np.asarray([],dtype=float),np.asarray([],dtype=float)
              cache=v5._REQUEST_LON_CACHE.get()
              if cache is None:
                  a=core.get_tropical_ecliptic_lons(body_a,seq)
                  b=core.get_tropical_ecliptic_lons(body_b,seq)
                  return np.asarray(a,dtype=float),np.asarray(b,dtype=float)

              missing=[
                  dt for dt in seq
                  if cache_key(body_a,dt) not in cache or cache_key(body_b,dt) not in cache
              ]
              if missing:
                  stats["pair_calls"]+=1
                  ts,_,earth,targets,_,_,_=core.load_ephemeris()
                  times=ts.from_datetimes([dt.astimezone(core.UTC) for dt in missing])
                  observer=earth.at(times)

                  app_a=observer.observe(targets[body_a]).apparent()
                  _,lon_a,_=app_a.frame_latlon(core.ecliptic_frame)
                  vals_a=np.ravel(np.asarray(lon_a.degrees,dtype=float)) % 360.0

                  app_b=observer.observe(targets[body_b]).apparent()
                  _,lon_b,_=app_b.frame_latlon(core.ecliptic_frame)
                  vals_b=np.ravel(np.asarray(lon_b.degrees,dtype=float)) % 360.0

                  for dt,a,b in zip(missing,vals_a,vals_b):
                      cache[cache_key(body_a,dt)]=float(a)
                      cache[cache_key(body_b,dt)]=float(b)

              return (
                  np.asarray([cache[cache_key(body_a,dt)] for dt in seq],dtype=float),
                  np.asarray([cache[cache_key(body_b,dt)] for dt in seq],dtype=float),
              )

          def pair_sample(body_a,row_a,body_b,row_b,dt_utc,horizon_days,step_hours):
              end_dt=dt_utc+timedelta(days=float(horizon_days))
              max_speed=max(abs(float(row_a.get("speed_deg_per_day") or 0.0)),abs(float(row_b.get("speed_deg_per_day") or 0.0)))
              chunk_days=3.0 if "Moon" in {body_a,body_b} else 10.0 if max_speed>=0.45 else 30.0
              start_a_sign=int(float(row_a["longitude"])//30)
              start_b_sign=int(float(row_b["longitude"])//30)
              all_times,all_a,all_b=[],[],[]
              cursor=dt_utc
              while cursor<end_dt:
                  chunk_end=min(end_dt,cursor+timedelta(days=chunk_days))
                  chunk_times=list(core._sample_datetimes(cursor,chunk_end,step_hours))
                  if all_times and chunk_times and chunk_times[0]==all_times[-1]:
                      chunk_times=chunk_times[1:]
                  if not chunk_times:
                      break
                  a_chunk,b_chunk=pair_lons(body_a,body_b,chunk_times)
                  for t,a_lon,b_lon in zip(chunk_times,a_chunk,b_chunk):
                      if int(float(a_lon)//30)!=start_a_sign:
                          return all_times,np.asarray(all_a,dtype=float),np.asarray(all_b,dtype=float),body_a
                      if int(float(b_lon)//30)!=start_b_sign:
                          return all_times,np.asarray(all_a,dtype=float),np.asarray(all_b,dtype=float),body_b
                      all_times.append(t);all_a.append(float(a_lon));all_b.append(float(b_lon))
                  cursor=chunk_end
              return all_times,np.asarray(all_a,dtype=float),np.asarray(all_b,dtype=float),None

          def pair_refine(body_a,body_b,aspect_angle,left_dt,right_dt,iterations=12):
              def orbs(times):
                  a,b=pair_lons(body_a,body_b,times)
                  seps=np.abs((a-b+180.0)%360.0-180.0)
                  return np.abs(seps-float(aspect_angle))
              left,right=left_dt,right_dt
              for _ in range(iterations):
                  span=right-left
                  m1=left+span/3
                  m2=right-span/3
                  vals=orbs([m1,m2])
                  if float(vals[0])<=float(vals[1]): right=m2
                  else: left=m1
              exact=left+(right-left)/2
              return exact,float(orbs([exact])[0])

          def scalar_cached(body,time_obj):
              cache=v5._REQUEST_LON_CACHE.get()
              if cache is not None:
                  try:
                      dt=time_obj.utc_datetime()
                      key=cache_key(body,dt)
                      if key in cache:
                          stats["scalar_cache_hit"]+=1
                          return cache[key]
                  except Exception:
                      pass
              stats["scalar_cache_miss"]+=1
              return original_scalar(body,time_obj)

          v3._sample_until_first_sign_change=pair_sample
          core._horary_refine_pair=pair_refine
          core.get_tropical_ecliptic_lon=scalar_cached

          candidate,candidate_seconds=run("PAIR_BATCH")
          print("PAIR_BATCH_EXACT_EQUAL=",baseline==candidate)
          print("PAIR_BATCH_STATS=",stats)
          print(f"PAIR_BATCH_SPEEDUP={base_seconds/candidate_seconds:.3f}x")
          if baseline!=candidate:
              raise SystemExit("pair batching changed output")
          PY
